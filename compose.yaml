services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    build:
      context: ./ops/minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-commerce-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-storage-only}
    command: ["server", "/data", "--console-address", ":9001"]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio_data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio-init:
    image: minio/mc:RELEASE.2025-07-16T15-35-03Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-commerce-storage}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-development-storage-only}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-commerce-images}
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./ops/minio/init.sh:/init.sh:ro
      - ./ops/minio/public-images-policy.json:/public-images-policy.json:ro
    restart: "no"
volumes:
  minio_data:
  postgres_data:
  redis_data:
